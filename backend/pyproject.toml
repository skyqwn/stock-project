[project]
name = "kis-backend"
version = "0.1.0"
description = "KIS stock quote scaffold backend"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.14.1",
    "pydantic[email]>=2.13.4",
    "python-jose[cryptography]>=3.5.0",
    "redis>=7.4.0",
    "sqlalchemy[asyncio]>=2.0.49",
    "uvicorn[standard]>=0.46.0",
]

[dependency-groups]
dev = [
    "anyio>=4.13.0",
    "fakeredis>=2.35.1",
    "pytest>=9.0.3",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
anyio_mode = "auto"
